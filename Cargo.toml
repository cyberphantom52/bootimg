[package]
name = "bootimgctl"
version = "0.1.0"
edition = "2024"
description = "Unpack, edit and repack Android boot, vendor_boot, vbmeta and dtbo images"
license = "GPL-3.0-or-later"
publish = false

[workspace]
members = ["crates/dtc-native"]

[dependencies]
dtc_native = { package = "bootimgctl-dtc-native", path = "crates/dtc-native", optional = true }
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"], optional = true }
flate2 = "1.1"
liblzma = { version = "0.4", features = ["static"] }
lz4 = "1.28"
rsa = { version = "0.9", features = ["sha2"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", optional = true }
sha1 = "0.10"
sha2 = { version = "0.10", features = ["oid"] }

[features]
default = ["cli"]
# The bootimgctl binary, with its workspaces and the bundled dtc (GPL-2.0-or-later).
cli = ["dep:clap", "dep:dtc_native", "dep:serde_json"]

[[bin]]
name = "bootimgctl"
required-features = ["cli"]

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

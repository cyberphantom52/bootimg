[package]
name = "bootimgctl-dtc-native"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-2.0-or-later"
description = "Upstream dtc compiled into a library, callable as a process entry point"
links = "dtc"

[build-dependencies]
cc = "1.2"

[package.metadata.dtc]
version = "1.8.1"
commit = "8f48565e5cfedc74d3f7512f1e0188e9d85dc1de"
# Regenerate from this crate when bumping dtc; normal builds use the checked-in files.
parser-command = "bison --defines=generated/dtc-parser.tab.h --output=generated/dtc-parser.tab.c vendor/dtc/dtc-parser.y"
lexer-command = "flex --outfile=generated/dtc-lexer.lex.c vendor/dtc/dtc-lexer.l"
